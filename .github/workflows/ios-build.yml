# โหมดเซ็นจริง (ต้องมี Apple Developer Program — ปีละ 99 USD)
#
# เพิ่ม secrets ใน repo (Settings → Secrets and variables → Actions):
#   BUILD_CERTIFICATE_BASE64   คือ .p12 ที่ base64 แล้ว
#   P12_PASSWORD               รหัสผ่านของ .p12
#   PROVISIONING_PROFILE_BASE64
#   KEYCHAIN_PASSWORD          ตั้งอะไรก็ได้
#   APPLE_TEAM_ID
#
# แล้วแทน 3 step ตั้งแต่ "Build iOS (release, unsigned)" ด้วย:
