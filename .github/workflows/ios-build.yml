name: iOS - Generate & Build

# วิธีใช้:
# 1) push โปรเจกต์นี้ขึ้น GitHub (ดูคำสั่ง git ที่แชตแนบให้)
# 2) ไปที่แท็บ Actions ของ repo -> เลือก workflow "iOS - Generate & Build" -> Run workflow
#    (หรือปล่อยให้รันอัตโนมัติทุกครั้งที่ push เข้า main)
# 3) ครั้งแรกที่รัน workflow จะสร้างโฟลเดอร์ ios/ ด้วย Flutter จริงบน macOS runner
#    แล้ว commit กลับเข้า repo ให้อัตโนมัติ ครั้งต่อไปจะข้ามขั้นตอนนี้เพราะมี ios/ อยู่แล้ว
# 4) ไฟล์ .app ที่ build ได้ (สำหรับ Simulator) จะถูกแนบเป็น Artifact ให้ดาวน์โหลดจากหน้า run

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  ios:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate ios/ platform files (only if missing)
        run: |
          if [ ! -d "ios" ]; then
            echo "ไม่พบโฟลเดอร์ ios/ กำลังสร้างด้วย flutter create ..."
            flutter create --platforms=ios --project-name edu_social --org com.edusocial .
          else
            echo "พบโฟลเดอร์ ios/ อยู่แล้ว ข้ามการสร้างใหม่"
          fi

      - name: Add required Info.plist permission strings
        run: |
          PLIST="ios/Runner/Info.plist"
          add_key () {
            KEY="$1"; VALUE="$2"
            if ! /usr/libexec/PlistBuddy -c "Print :$KEY" "$PLIST" > /dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Add :$KEY string $VALUE" "$PLIST"
            fi
          }
          add_key "NSCameraUsageDescription" "แอปต้องการใช้กล้องสำหรับวิดีโอคอลและถ่ายรูปโปรไฟล์/โพสต์"
          add_key "NSMicrophoneUsageDescription" "แอปต้องการใช้ไมโครโฟนสำหรับการโทรด้วยเสียง/วิดีโอ"
          add_key "NSPhotoLibraryUsageDescription" "แอปต้องการเข้าถึงรูปภาพเพื่ออัปโหลดโปรไฟล์และโพสต์"
          add_key "NSPhotoLibraryAddUsageDescription" "แอปต้องการบันทึกรูปภาพลงในคลังภาพของคุณ"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$PLIST" > /dev/null 2>&1 || true

      - name: Set iOS deployment target to 13.0
        run: |
          if [ -f "ios/Podfile" ]; then
            sed -i '' "s/# platform :ios, '.*'/platform :ios, '13.0'/" ios/Podfile || true
          fi

      - name: Commit generated ios/ files back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ios
          if ! git diff --cached --quiet; then
            git commit -m "chore: generate iOS platform files (automated)"
            git push
          else
            echo "ไม่มีการเปลี่ยนแปลงใน ios/ ที่ต้อง commit"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS for Simulator (no code signing needed)
        run: flutter build ios --simulator --release

      - name: Zip built app for download
        run: |
          cd build/ios/iphonesimulator
          zip -r Runner-simulator.zip Runner.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-simulator
          path: build/ios/iphonesimulator/Runner-simulator.zip
